# Pipeline científica — configuração única (independente do runtime)
# Valores aqui podem ser sobrepostos por variáveis de ambiente do adapter (FETAL_*).

experiment_name: fetal_vein_unet

training:
  epochs: 150
  learning_rate: 0.01
  seed: 0
  val_interval: 1
  num_workers: 0
  batch_size_train: 10
  batch_size_val: 5
  batch_size_test: 1
  min_samples_required: 3

scheduler:
  name: cosine
  # T_max alinhado com epochs; ajustar se usar early stopping no futuro.
  t_max: 150

loss:
  name: dice
  sigmoid: true
  # squared_pred estabiliza gradientes em predições próximas de 0/1 (padrão MONAI segmentação).
  squared_pred: true
  smooth_nr: 0
  smooth_dr: 1.0e-5
  to_onehot_y: false

metrics:
  threshold: 0.5
  include_background: true

model:
  spatial_dims: 2
  in_channels: 1
  out_channels: 1
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

data:
  primary_ground_truth_dir: labels
  fallback_ground_truth_dir: masks
  image_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".bmp"]
  split:
    mode: counts
    seed: 0
    shuffle: true
  train_count: 110
  val_count: 20
  test_count: null
  train_ratio: null
  val_ratio: 0.15
  test_ratio: null
  label_binarization_threshold: 0.5

outputs:
  checkpoints_dir: checkpoints
  predictions_dir: predictions
  logs_dir: logs
  metrics_file: metrics.json

evaluation:
  metrics_subdir: metrics
  plots_subdir: plots
  tables_subdir: tables
