# Configuração da pipeline científica (única — independente do runtime)

experiment_name: fetal_vein_unet

training:
  epochs: 5
  batch_size: 2
  learning_rate: 0.0001
  num_workers: 0
  seed: 42

model:
  in_channels: 1
  out_channels: 1
  spatial_dims: 2
  channels: [16, 32, 64, 128]
  strides: [2, 2, 2]

data:
  image_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".bmp"]
  train_split: 0.8

outputs:
  checkpoints_dir: checkpoints
  logs_dir: logs
  metrics_file: metrics.json
