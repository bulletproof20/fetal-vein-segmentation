# Executar a partir desta pasta (10-docker):
#   docker compose build
#   docker compose up
#
# Sem GPU NVIDIA: comente o bloco deploy.resources.reservations abaixo.

services:
  fetal-segmentation:
    build:
      context: ..
      dockerfile: 10-docker/Dockerfile
    image: fetal-vein-segmentation:latest
    container_name: fetal-vein-segmentation
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      PROJECT_ROOT: /workspace
      DATA_DIR: /workspace/02-dataset
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-fetal-dev}
      JUPYTER_PORT: "8888"
      BOOTSTRAP_STRICT: ${BOOTSTRAP_STRICT:-1}
      BOOTSTRAP_ARGS: ${BOOTSTRAP_ARGS:-}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ..:/workspace
      - jupyter-home:/root/.local
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  jupyter-home:
