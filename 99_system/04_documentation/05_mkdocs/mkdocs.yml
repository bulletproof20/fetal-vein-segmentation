# MkDocs — fetal_vein_segmentation
# Run from this directory: mkdocs serve

site_name: Fetal Vein Segmentation
site_description: Documentação académica e técnica — segmentação da veia umbilical fetal
site_author: IPCA — Imagem Biomédica

repo_name: fetal_vein_segmentation
# repo_url: set when remote is available

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - ../../..
            - ../../../00_common
            - ../../../99_system/02_bootstrap
            - ../../../04_segmentation
            - ../../../99_system/01_runtime
            - ../../../99_system/01_runtime/local_cpu
            - ../../../99_system/01_runtime/local_gpu
            - ../../../99_system/01_runtime/kaggle
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - ..
        - ../..
        - ../../..
        - ../../01_governance
        - ../../02_architecture

nav:
  - Início: index.md

  - Governação:
      - governance/index.md
      - Visão global: governance/project_governance.md
      - Código Python: governance/coding_standards.md
      - Notebooks: governance/notebook_standards.md
      - Documentação: governance/documentation_standards.md
      - Nomenclatura: governance/naming_conventions.md
      - Experiências: governance/experiment_standards.md

  - Arquitetura:
      - architecture/index.md
      - Sistema: architecture/system_architecture.md
      - Runtime: architecture/runtime_architecture.md
      - Fluxo de dados: architecture/data_flow.md
      - Stack (detalhe): architecture/technology_stack.md

  - Templates:
      - templates/index.md
      - Módulo Python: templates/python_module_template.md
      - Função Python: templates/python_function_template.md
      - Classe Python: templates/python_class_template.md
      - Notebook: templates/notebook_template.md
      - Markdown: templates/markdown_document_template.md
      - Experiência: templates/experiment_template.md

  - Migração:
      - migration/index.md
      - Auditoria (Fase 1): migration/audit_report.md
      - Validação nomenclatura: migration/naming_validation_report.md
      - Mapa de migração: migration/migration_map.md
      - Plano Fase 10: migration/migration_plan.md
      - Uniformização 3.1: migration/uniformization_report.md
      - Decisão Nível A: migration/level_a_decision.md

  - Projeto:
      - project_structure/index.md
      - Tecnologias: technologies/index.md

  - Academic Context:
      - academic/index.md
      - Assignment: academic/assignment/README.md
      - Worksheets: academic/worksheets/README.md
      - Course Material: academic/course_material/README.md

  - Componentes:
      - Runtimes: runtimes/index.md
      - Bootstrap: bootstrap/index.md
      - Pipeline: pipeline/index.md
      - Notebooks: notebooks/index.md
      - Experiências: experiments/index.md

  - API Reference:
      - api/index.md
      - Pipeline:
          - api/train.md
          - api/dataset.md
          - api/model.md
      - Bootstrap:
          - api/bootstrap.md
          - api/config.md
          - api/checks.md
      - Runtime:
          - api/runtime_paths.md
          - api/adapter.md

extra:
  generator: false
