# MkDocs configuration — published via: mkdocs gh-deploy
# Documentation source: 06_documentation/

site_name: Fetal Vein Segmentation
site_description: Academic project portal — fetal vein segmentation (IPCA, EIM).
site_author: Ivo Sá · Diogo Sousa

site_url: https://bulletproof20.github.io/fetal-vein-segmentation/

repo_name: fetal-vein-segmentation
repo_url: https://github.com/bulletproof20/fetal-vein-segmentation
edit_uri: edit/main/06_documentation/

docs_dir: 06_documentation
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
        - ..
  - tables
  - toc:
      permalink: true

exclude_docs: |
  04_migration/*
  **/experiment_standards.md
  MKDOCS_PUBLISHING.md

nav:
  - Home: index.md
  - Project:
      - Overview: portal/project_overview.md
      - Assignment: portal/assignment.md
      - State of the Art: portal/state_of_the_art.md
      - Dataset:
          - Overview: portal/dataset.md
          - Licence: portal/dataset_licence.md
      - Results: portal/results.md
      - Final Report: portal/final_report.md
  - Technical Documentation:
      - Scientific Pipeline: portal/pipeline.md
      - Architecture: 02_architecture/system_architecture.md
      - Data Flow: 02_architecture/data_flow.md
      - Governance: 01_governance/project_governance.md
      - Additional Documentation: portal/additional.md

extra:
  generator: false
